{% extends "base.html" %}

{% block title %}Login - CareerPilot AI{% endblock %}

{% block content %}

<div class="auth-wrapper">

<div class="auth-card">

<div class="logo">
Career<span>Pilot</span> AI
</div>

<div class="subtitle">
Land Your Dream Job with AI
</div>

{% if error %}
<div class="alert alert-danger">
{{ error }}
</div>
{% endif %}

<form method="POST">

<div class="form-group">
<label>Email</label>
<input
type="email"
name="email"
class="form-control-custom"
required>
</div>

<div class="form-group">
<label>Password</label>
<input
type="password"
name="password"
class="form-control-custom"
required>
</div>

<button class="btn-primary-custom">
Login
</button>

</form>

<div class="auth-link">
Don't have an account?

<a href="/register">
Create one
</a>

</div>

</div>

</div>

{% endblock %}
